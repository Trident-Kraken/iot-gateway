name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc libmosquitto-dev mosquitto mosquitto-clients

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: CTest self-checks
        run: ctest --test-dir build --output-on-failure

      - name: Integration smoke (gateway + mosquitto)
        run: |
          set -e
          mkdir -p logs
          mosquitto -d
          ./build/src/iot-gateway &
          GW_PID=$!
          trap 'kill $GW_PID 2>/dev/null || true; pkill -x mosquitto 2>/dev/null || true' EXIT
          sleep 2
          # 先订阅再产生流量（QoS0 消息不重放，订阅者须先行）
          timeout 20 mosquitto_sub -t 'sensor/data' -C 1 -h localhost -p 1883 >/tmp/mqtt_msg.txt &
          SUB_PID=$!
          python3 tests/integration/device_simulator.py --devices 1 --freq 2 --duration 2 --stats
          wait $SUB_PID
          test -s /tmp/mqtt_msg.txt
