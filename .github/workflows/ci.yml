name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc libmosquitto-dev mosquitto mosquitto-clients

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: CTest (unit + integration)
        # 单测 7 项 + 集成 7 项（E2E/连接生命周期/MQTT 离线缓存/
        # 配置校验/故障注入/超时关闭竞态回归/fd 耗尽处理）；
        # 依赖缺失或环境受限时用例返回 77 被跳过。
        run: ctest --test-dir build --output-on-failure
